name: lodbod
description: "LODBOD Shipper Mobile Application — Flutter Technical Assignment"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # HTTP (ready for real API swap)
  dio: ^5.4.3+1

  # Secure Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # UI / UX
  shimmer: ^3.0.0
  gap: ^3.0.1
  intl: ^0.19.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
